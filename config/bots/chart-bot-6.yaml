id: chart-bot-6
name: "Chart Bot 6 · Micro S&P"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
manual_entry_only: true   # operator trades manually via the console / chart strip
auto_start: false   # operator-driven Start
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  ref_id: chart-bot-6-mes
  # MES = Micro E-mini S&P 500 (CME). U6 = Sep 2026 front month (same
  # quarterly cycle as full ES/ESU6; roll H/M/U/Z). QBALGO twin dropped
  # by the qualifier (insync_client 46953eb) so bare ``MESU6`` resolves
  # to CME unambiguously.
  symbol: MESU6
  sec_type: FUT
  # Micro S&P: $5/point (1/10th of full ES's $50). Used by the
  # strategy's P/L math + trail target.
  contract_multiplier: 5
  # Trailing dip 0.0003 (a percentage, scales with notional). Manual
  # mode in effect, so dormant until ``manual_entry_only`` flips.
  trail_width_pct: 0.0003
  qty_default: 1
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- MESU6
