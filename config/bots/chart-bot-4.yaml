id: chart-bot-4
name: "Chart Bot 4 · Micro Nasdaq"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
manual_entry_only: false
auto_start: false   # operator-driven Start; banner reminds on each `make dev`
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  ref_id: chart-bot-4-mnq
  # MNQ = Micro E-mini Nasdaq-100. M6 = June 2026.
  symbol: MNQM6
  sec_type: FUT
  # Micro Nasdaq: $2/point. Used by P/L math + trail target.
  contract_multiplier: 2
  # Trailing dip: 0.02% × 29,395 pts × $2 ≈ $11.76 per contract per move.
  trail_width_pct: 0.0002
symbols:
- MNQM6
