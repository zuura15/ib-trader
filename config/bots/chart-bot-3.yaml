id: chart-bot-3
name: "Chart Bot 3 · Micro SPX"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
manual_entry_only: true   # flipped 2026-05-28 — missed in the 2026-05-24 sweep (dev-branch drift)
auto_start: false   # operator-driven Start; banner reminds on each `make dev`
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  ref_id: chart-bot-3-mes
  # MES = Micro E-mini S&P 500. M6 = June 2026.
  # E-minis trade quarterly only (H/M/U/Z). Industry roll to U6
  # is ~June 11, 2026 (~8 days before expiry on June 19). Roll
  # then, not earlier — U6 is back-month until rollover and has
  # ~5-10% of M6's volume so spreads are wider.
  symbol: MESM6
  sec_type: FUT
  # Micro E-mini S&P: $5/point. Used by P/L math + trail target.
  contract_multiplier: 5
  # Trailing dip: 0.03% × 7,420 pts × $5 ≈ $11.13 per contract per move.
  trail_width_pct: 0.0003
  # 3 contracts per fire (operator setting 2026-05-18). Override
  # of strategy yaml's qty_default: 1.
  qty_default: 3
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- MESM6
