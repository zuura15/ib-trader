id: chart-bot-5
name: "Chart Bot 5 · S&P 500"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
# Manual-entry-only (see chart-bot-4). Bot evaluates bars but the
# runtime's ManualEntryMiddleware drops auto-entries; only operator
# force / console / chart-strip orders and strategy exits reach IB.
manual_entry_only: true
auto_start: false   # operator-driven Start
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  ref_id: chart-bot-5-es
  # ES = full E-mini S&P 500, Sep 2026. Added 2026-06-22 as a tabbed
  # chart alongside MNQU6 (the operator trades ES intraday). U6 is the
  # front month (M6 → U6 roll was 2026-06-11). QBALGO twin dropped by
  # the qualifier (insync_client 46953eb) so bare ``ESU6`` resolves to
  # CME unambiguously.
  symbol: ESU6
  sec_type: FUT
  # Full E-mini S&P: $50/point (10x micro). Used by the strategy's
  # P/L math + trail target.
  contract_multiplier: 50
  # Trailing dip 0.0003 (a percentage, scales with notional). Manual
  # mode in effect, so dormant until ``manual_entry_only`` flips.
  trail_width_pct: 0.0003
  qty_default: 1
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- ESU6
