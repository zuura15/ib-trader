id: chart-bot-5
name: "Tick Fuzzy · MES"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
# Tick-driven fuzzy strategy (ADR 019). Exit lifecycle is implemented:
# dollar-denominated SL + HWM trail. Entry is still operator-driven via
# Force LONG / Force SHORT — manual_entry_only stays TRUE in v0.1 until
# the line-bounce FSM ships. Force the entry; the strategy manages the
# exit tick-by-tick.
#
# Switched MNQ → MES on 2026-05-20 for low-loss live testing. Dollar
# limits in config/strategies/tick_fuzzy.yaml are UNCHANGED — $10 SL,
# +$20 trail-activate, $5 give-back. The contract_multiplier flip
# (2 → 5) is what re-scales the price-space stop: at $10 SL on MES,
# active_stop = entry ± 2.0 points (8 ticks), vs ± 5.0 points on MNQ.
manual_entry_only: true
auto_start: false
config:
  strategy_name: tick_fuzzy
  strategy_config: config/strategies/tick_fuzzy.yaml
  ref_id: chart-bot-5-mes
  # MES = Micro E-mini S&P 500. M6 = June 2026.
  symbol: MESM6
  sec_type: FUT
  # Micro E-mini S&P: $5/point. Used by P/L math + active_stop calc.
  contract_multiplier: 5
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- MESM6
