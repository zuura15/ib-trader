id: chart-bot-5
name: "Chart Bot 5 · WTI Crude"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
# Manual-entry-only (see chart-bot-4). Bot evaluates bars but the
# runtime's ManualEntryMiddleware drops auto-entries; only operator
# force / console / chart-strip orders and strategy exits reach IB.
manual_entry_only: true
auto_start: false   # operator-driven Start
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  # ref_id kept as ``chart-bot-5-es`` (stable bot identifier from this
  # pane's ES era) — renaming would orphan any force-entry orders
  # tagged with it at recovery, for no functional gain. Precedent:
  # chart-bot-2 kept ``-mcl`` through its micro-oil → WTI repurpose.
  ref_id: chart-bot-5-es
  # CL = full WTI Crude Oil (NYMEX), Oct 2026. Repurposed 2026-09-02
  # from ESU6 (operator dropped the ES charts in favor of WTI). V6 is
  # the front month; roll monthly (next: X6 before late-Sep expiry).
  # QBALGO twin dropped by the qualifier (insync_client 46953eb) so
  # bare ``CLV6`` resolves to NYMEX unambiguously.
  symbol: CLV6
  sec_type: FUT
  # Full Crude: 1,000 bbl/contract → $1.00 move = $1,000 (tick $0.01
  # = $10). Used by the strategy's P/L math + trail target.
  contract_multiplier: 1000
  # Trailing dip 0.13% (a percentage, scales with notional) — same
  # tuning the retired chart-bot-2 WTI pane used. Manual mode in
  # effect, so dormant until ``manual_entry_only`` flips.
  trail_width_pct: 0.0013
  qty_default: 1
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- CLV6
