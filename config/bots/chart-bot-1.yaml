id: chart-bot-1
name: "Chart Bot 1 · Gold"
strategy: strategy_bot
broker: ib
tick_interval_seconds: 10
manual_entry_only: true   # flipped 2026-05-24 — operator going fully manual via console
# auto_start kept off intentionally — operator picks when each chart
# slot resumes. The bot-runner advertises the OFF state in its
# startup banner so a forgotten Start click is hard to miss.
auto_start: false
config:
  strategy_name: chart_signal
  strategy_config: config/strategies/chart_signal.yaml
  # Per-bot ref_id keeps the WS state subscription unique. All four
  # chart_signal bots share the same strategy yaml, so they'd
  # collide on the strategy's ref_id without this.
  ref_id: chart-bot-1-gc
  # GC = full Gold (100 oz). Switched from micro MGCQ6 → full GCQ6
  # on 2026-06-07 as the operator scaled into full contracts. Same
  # August 2026 expiry (Q6). Next roll: V6 (Oct) before late-Aug
  # expiry. QBALGO twin is dropped by the qualifier (insync_client
  # commit 46953eb) so the bare ``GCQ6`` localSymbol resolves to
  # COMEX unambiguously.
  symbol: GCQ6
  sec_type: FUT
  # Full Gold: 100 oz/contract (10x micro). Used by P/L math + trail
  # target.
  contract_multiplier: 100
  # Trailing dip: same percentage as the micro tuning (0.0005). At
  # GC's notional that's ~$228.90 per contract per dip (vs $22.90
  # on the micro) — same risk-as-fraction-of-position. Manual mode
  # in effect so this is dormant until ``manual_entry_only`` flips.
  trail_width_pct: 0.0005
  # After a round-trip, transition back to AWAITING_ENTRY_TRIGGER
  # (not OFF) and respect a one-bar cool-off before re-entering.
  # Operator turns the bot on once and it lives through round-trips.
  stop_on_exit: false
  cooldown_seconds: 0
symbols:
- GCQ6
