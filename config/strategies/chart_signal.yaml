# Chart-Signal Strategy
# 3-touch SR fan: long on uptrending support, exit on bar-close below
# the entry line. One-and-done per arm (manual re-arm required).
# Long-only in v1.

name: chart_signal
version: "1.0"
ref_id: chart-signal-default

# Per-bot YAMLs override the symbol/sec_type fields below. This file
# carries the algo defaults.
symbol: SPY            # placeholder; per-bot config overrides
sec_type: STK          # STK | ETF | FUT | FOP — drives the deadzone check

# Bar configuration
bar_size_seconds: 180   # 3-minute bars; must match frontend chart
# The aggregator is used only as a 3-min "tick" — the strategy fetches
# its own bars from ``/engine/history`` (same as the view-only chart),
# so we don't need it to buffer a long lookback. ``lookback_bars: 1``
# unblocks the runtime's ``get_bar_window`` gate after the first 3-min
# bar, and the strategy ignores the window the runtime hands it.
lookback_bars: 1
# How much history the bot fetches from ``/engine/history`` per
# 3-min eval. Mirrors the view-only chart's default visible range
# so both surfaces compute SR on the same slice.
history_hours: 24

# Quantity — per-bot override possible via UI in a future iteration.
qty_default: 1

# Order strategies
order_strategy: mid     # entry: mid limit (futures spreads tight)
exit_order_strategy: mid

# Risk knobs — kept minimal. The exit is the SR line itself.
max_position_value: 100000
max_shares: 100

# Acceleration-continuation entry (2-pivot base, 2026-05-18).
# When ``acceleration_entry_enabled`` is true, the bot looks at the
# 2 immediately-preceding same-kind pivots (Q older, P newer) and
# treats the just-confirmed pivot as the "3rd" overshoot point.
# Q→P forms the base line. Accel fires when:
#   (a) Q and P are both inside ``entry_max_q_age_hours`` of the
#       fire bar (local structure, not weeks-old),
#   (b) the just-confirmed pivot is strictly outside the Q→P line
#       in the favorable direction beyond ``near_touch_tolerance_fraction``,
#   (c) implied slope (P → new_pivot) is ≥ ``min_slope_ratio`` ×
#       the Q→P slope (in the same direction).
# Earlier accel implementation required a 3+touch base line, which
# meant accel only fired at the 4th+ pivot — by then the trend
# was established and the entry was often stale. The 2-pivot base
# means accel fires at the 3rd pivot, the earliest the directional
# pattern is recognizable.
acceleration_entry_enabled: true
min_slope_ratio: 1.5

# Marginal-entry mode. When ``allow_marginal_entries`` is true,
# entries that the entry-side filters below would normally REJECT
# still fire — they're tagged ``marginal`` and use the tick-time
# exit machinery (trail ratchet + 5s touch+hold SL + 10s
# counter-line / trigger-line linger) so a snap-back exits the
# trade quickly. The bypassable filters are entry-quality
# judgements made AFTER a valid pivot has been confirmed on a
# valid line:
#   - shoulder            (right-shoulder reversal confirmation)
#   - min_target          (wedge target ≥ stop)
#   - tight_triangle      (wedge apex within block distance)
#   - opposing_dominance  (opposing-side touch count ≥ ratio × chosen)
#   - counter_trend       (SHORT on up-sloping resistance or LONG on
#                          down-sloping support — fading the line's
#                          own direction. Mirrors the chart's
#                          ``showCounterResistance``/``showCounterSupport``
#                          defaults.)
# Hard-reject (NOT bypassable, regardless of allow_marginal):
#   - max_signal_age      (bar event arrived too late — engine queue
#                          freshness check, not a market judgement)
#   - far_from_pivot      (entry price > ``mult`` × trail_dist past
#                          the chosen line. Entering "into thin air"
#                          past the rejection point. Was bypassable
#                          briefly; moved to hard-reject 2026-05-18
#                          after a MGC SHORT fired with the entry
#                          $7.45 below the resistance. Acceleration
#                          entries are NOT exempt (2026-05-18) —
#                          FFP acts from the pivot, regardless of
#                          how the pivot was detected.)
#   - stale_line          (line has fewer than
#                          ``entry_min_recent_strict_touches``
#                          (default 2) strict touches in the last
#                          ``entry_max_q_age_hours`` (default 24h).
#                          Validity gate.)
#   - broken lines        (line.break_idx is not None — the market
#                          already chose to violate this line. Hard
#                          gate in the entry-candidate iteration
#                          itself, not even a SKIP signal.)
# Operator distinction 2026-05-18: filters that VALIDATE THE LINE
# (broken, stale) are line-validity gates and never bypassable;
# filters that judge the ENTRY off a valid pivot on a valid line
# are entry-quality and bypassable.
# Clean trades (no filter rejection) use the normal opposing-only
# counter_line exit. Audit feed tags with ``·marginal`` so the
# operator can A/B per trade.
allow_marginal_entries: true

# Counter-trend filter enabled. Reject SHORT on up-sloping
# resistance and LONG on down-sloping support. Bypassable in
# marginal mode (entry-quality, not line-validity).
entry_counter_trend_filter_enabled: true

# Stale-line: require ≥ 2 strict touches on the chosen line in the
# last 24 hours. Hard-reject — not bypassable in marginal mode.
entry_min_recent_strict_touches: 2

# Tick-time SL. Two different mechanics by entry confidence:
#   - clean:    periodic poll every ``sl_check_clean_seconds`` (60s
#               default). The SL is sampled on the first tick after
#               each interval boundary; if breached, fires
#               immediately. Between samples, ticks are ignored.
#               3× tighter than the prior 3-min bar-close check
#               without giving up to tick-spike noise.
#   - marginal: touch+hold linger of ``sl_linger_marginal_seconds``
#               (10s default). Continuous breach for the full
#               window fires; a retrace clears the timer so a
#               re-breach starts a fresh window. Tight because
#               marginal entries are lower-conviction.
sl_check_clean_seconds: 60
sl_linger_marginal_seconds: 10

# Local-regime filter (ADX + ATR + Donchian via pandas-ta).
# Runs AFTER pivot detection and BEFORE the entry-filter chain.
# Bar-level gates — hard-reject, not bypassable in marginal mode
# (these classify the market, not the entry quality):
#   - local_peak_in_uptrend     (SHORT candidate, but local regime is up)
#   - local_trough_in_downtrend (LONG candidate, but local regime is down)
#   - flat_amplitude     (flat regime + expected swing < cost floor)
#   - flat_extreme       (flat regime + pivot not at Donchian extreme)
#   - insufficient_bars_for_regime  (warm-up not complete; falls
#                                    through to flat-conservative gates,
#                                    surfaced as a RISK row when an
#                                    entry IS let through)
#
# Decision tree:
#   ADX > adx_trending_threshold (25):
#     +DI > −DI  → up-trend  → block SHORT
#     +DI < −DI  → down-trend → block LONG
#   ADX < adx_ranging_threshold (20):
#     flat regime → require (a) ATR × typical_bars ≥ edge_mult × costs,
#                            (b) pivot near Donchian extreme.
#   20 ≤ ADX ≤ 25:
#     uncertain → same as flat (conservative).
regime_filter_enabled: true
# ADX period dropped from 14 to 7 (2026-05-18) — Wilder smoothing
# on 14 bars (~42 min of 3-min bars) lagged V recoveries by 15-25
# minutes; ADX stayed pinned to the prior trend while the market
# had already turned. 7 bars (~21 min) is roughly 2× as responsive
# to regime transitions. Trade-off: more "uncertain" reads during
# minor pullbacks in steady trends; that's acceptable because
# uncertain → flat-conservative gates still apply (extreme +
# amplitude), they're just not the trending-side hard reject.
adx_period: 7
atr_period: 14
donchian_period: 20
adx_trending_threshold: 25.0
adx_ranging_threshold: 20.0
# Flat-regime amplitude check: expected_swing = ATR × N where N =
# regime_typical_bars_in_trade. Skip when expected_swing <
# regime_min_edge_mult × cost_floor (round_trip_comm/multiplier +
# 2× touch_tol). Defaults give roughly: MGC needs ~$0.40/bar ATR to
# pass at 5 bars × 2 edge = $4 expected vs ~$2 cost.
regime_typical_bars_in_trade: 5.0
regime_min_edge_mult: 2.0
# Donchian extreme tol multiplier. tol = touch_tol × this. Larger
# values are more permissive (pivot can be further from the band).
# Donchian extreme tolerance multiplier. tol = touch_tol × mult.
# Bumped from 1.0 → 2.0 (2026-05-18) — the strict "within 1×
# touch_tol of DCU/DCL" was rejecting pivots that were
# operator-judgment "at the extreme" but missing the band by a
# tick. Doubling roughly halves the filter's strictness. Raise
# further (3-4) to relax more; drop back to 1 for the original
# strict gate.
regime_extreme_tol_mult: 2.0
# DI-lean override (flat/uncertain regime). When the regime is not
# trending (ADX below trending_threshold) but DI dominance toward
# the entry direction is at least this many points, skip the
# Donchian extreme check (amplitude gate still applies). ADX is
# laggy — a fresh downtrend often has −DI clearly above +DI well
# before ADX confirms. Lower this to be more permissive (allow
# entries on weaker directional signal); raise to require stronger
# confirmation. Default 7 separates "clearly directional" (10+
# observed in MES sell-offs) from "noise" (1-5 in chop).
regime_di_lean_threshold: 7.0
# Per-symbol round-trip commission used as cost floor. Falls back
# to the in-code default {MGCM6: 1.94, MESM6: 1.24, MNQM6: 1.24}
# when unset; override here for non-default symbols.
# regime_round_trip_commission: 1.94
